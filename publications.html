<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Publications, preprints, and manuscripts in review from the Behavioral Data Science Research Lab, filterable by topic, type, and year.">
    <title>Publications - Behavioral Data Science Research Lab</title>
    <link rel="icon" type="image/png" href="images/Pliny-the-Pigeon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="publications.css">
</head>
<body>
    <div class="cyberpunk-container">
        <div class="cyber-grid"></div>

        <header class="cyber-header">
            <div class="header-content">
                <h1 class="lab-title">
                    <span class="glitch" data-text="BEHAVIORAL">BEHAVIORAL</span>
                    <span class="glitch" data-text="DATA">DATA</span>
                    <span class="glitch" data-text="SCIENCE">SCIENCE</span>
                    <span class="lab-subtitle">RESEARCH LAB</span>
                </h1>
                <div class="pliny-logo">
                    <div class="pliny-container">
                        <img src="images/Pliny-the-Pigeon.png" alt="Pliny the Pigeon" class="pliny-image">
                    </div>
                </div>
            </div>
        </header>

        <nav class="cyber-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">TOPIC MAP</a></li>
                <li><a href="about.html" class="nav-link">ABOUT US</a></li>
                <li><a href="projects.html" class="nav-link">CURRENT PROJECTS</a></li>
                <li><a href="publications.html" class="nav-link active">PUBLICATIONS</a></li>
                <li><a href="books.html" class="nav-link">BOOKS &amp; COURSE COMPANIONS</a></li>
            </ul>
        </nav>

        <main class="cyber-main pubs">
            <section class="pubs-head">
                <h2 class="pubs-title">Permanent Products</h2>
                <div class="pubs-years">
                    <svg id="pubs-hist" role="img" aria-label="Publications per year; drag to filter by years"></svg>
                    <div class="pubs-years-label"><span id="pubs-range"></span></div>
                </div>
            </section>

            <section class="pubs-controls" aria-label="Filter publications">
                <div class="pubs-row">
                    <label class="pubs-search">
                        <span class="sr-only">Search titles, authors, and venues</span>
                        <input type="search" id="pubs-q" placeholder="Search titles, authors, venues" autocomplete="off">
                    </label>
                    <div class="pubs-dd">
                        <button type="button" class="pubs-dd-btn" aria-expanded="false" aria-controls="pubs-topics">Topics <span class="pubs-dd-sum" id="pubs-topics-sum"></span></button>
                        <div class="pubs-dd-panel" id="pubs-topics" role="group" aria-label="Topics" hidden></div>
                    </div>
                    <div class="pubs-dd">
                        <button type="button" class="pubs-dd-btn" aria-expanded="false" aria-controls="pubs-types">Type <span class="pubs-dd-sum" id="pubs-types-sum"></span></button>
                        <div class="pubs-dd-panel" id="pubs-types" role="group" aria-label="Publication type" hidden></div>
                    </div>
                </div>
            </section>

            <div class="pubs-status"><p class="pubs-count" id="pubs-count" aria-live="polite"></p><button type="button" id="pubs-reset" class="pubs-clear">Clear filters</button><p class="pubs-export" id="pubs-export"><span id="pubs-export-n"></span> <button type="button" data-fmt="bib">BibTeX</button> <button type="button" data-fmt="ris">RIS</button> <button type="button" data-fmt="apa">APA</button></p></div>
            <section id="pubs-list" class="pubs-list"></section>
        </main>

        <footer class="cyber-footer">
            <div class="footer-content">
                <p>&copy; 2026 Behavioral Data Science Research Lab</p>
            </div>
        </footer>
    </div>

<script src="data/publications.js"></script>
<script src="publications.js"></script>
</body>
</html>
