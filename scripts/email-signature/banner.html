<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* Email-signature books banner. Rendered to images/email-signature-books.png
     by render.sh (headless Chrome at 2x). Edit here, then re-run render.sh. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  #banner {
    width: 1462px;
    height: 268px;
    background: #ffffff;
    border: 1px solid #e4e7ec;
    border-radius: 12px;
    border-left: 5px solid #155a9c;
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 40px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .text {
    width: 262px;
    flex: 0 0 262px;
  }
  .title {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 700;
    color: #1a1f24;
  }
  .byline {
    margin-top: 8px;
    font-size: 15px;
    color: #667085;
    font-weight: 500;
  }
  .cta {
    margin-top: 18px;
    display: inline-block;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: #155a9c;
    padding: 9px 16px;
    border-radius: 7px;
  }
  .covers {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 0 0 auto;
  }
  .covers img {
    height: 254px;
    width: auto;
    border-radius: 3px;
    border: 1px solid rgba(16, 24, 40, 0.10);
    box-shadow: 0 2px 6px rgba(16, 24, 40, 0.16);
    display: block;
  }
</style>
</head>
<body>
  <div id="banner">
    <div class="text">
      <div class="title">Books by<br>David J. Cox</div>
      <div class="byline">Ph.D., M.S.B., BCBA-D</div>
      <div class="cta">Explore all books &rarr;</div>
    </div>
    <div class="covers">
      <img src="covers/1-business-technology.jpg" alt="">
      <img src="covers/2-clinical-educational-training.jpg" alt="">
      <img src="covers/3-statistics.jpg" alt="">
      <img src="covers/4-research-ethics.jpg" alt="">
      <img src="covers/5-practical-ethics.jpg" alt="">
      <img src="covers/6-math-modeling.jpg" alt="">
    </div>
  </div>
</body>
</html>
