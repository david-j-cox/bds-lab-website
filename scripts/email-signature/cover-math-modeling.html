<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* Custom cover for "Introduction to Mathematical Modeling in Behavior
     Science". Rendered to covers/6-math-modeling.jpg by render-cover.sh.
     Aspect ratio matches the publisher covers (331 x 500). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cover {
    width: 331px;
    height: 500px;
    background: linear-gradient(160deg, #0a2947 0%, #12395f 55%, #17456f 100%);
    font-family: "Georgia", "Times New Roman", serif;
    color: #ffffff;
    position: relative;
    overflow: hidden;
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
  }
  .series {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #7fb2e0;
    text-transform: uppercase;
  }
  .title {
    margin-top: 16px;
    font-size: 26px;
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .rule {
    margin-top: 16px;
    width: 54px;
    height: 3px;
    background: #f5c451;
    border-radius: 2px;
  }
  .art {
    margin-top: auto;
    margin-bottom: 22px;
  }
  .author {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #eaf2fb;
  }
  .imprint {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #7fb2e0;
    margin-top: 5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="series">Behavior Science</div>
    <div class="title">Introduction to Mathematical Modeling in Behavior Science</div>
    <div class="rule"></div>

    <div class="art">
      <svg width="279" height="176" viewBox="0 0 279 176" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- grid -->
        <g stroke="#2d537b" stroke-width="1">
          <line x1="0" y1="44" x2="279" y2="44"/>
          <line x1="0" y1="88" x2="279" y2="88"/>
          <line x1="0" y1="132" x2="279" y2="132"/>
          <line x1="70" y1="0" x2="70" y2="164"/>
          <line x1="140" y1="0" x2="140" y2="164"/>
          <line x1="209" y1="0" x2="209" y2="164"/>
        </g>
        <!-- axes -->
        <line x1="0" y1="164" x2="279" y2="164" stroke="#a9c7e6" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="164" stroke="#a9c7e6" stroke-width="2"/>
        <!-- fitted curve (negatively accelerating / saturating) -->
        <path d="M4 150 C 60 150, 70 40, 275 26" stroke="#f5c451" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- data points scattered around the curve -->
        <g fill="#eaf2fb">
          <circle cx="20" cy="146" r="4"/>
          <circle cx="52" cy="120" r="4"/>
          <circle cx="80" cy="96" r="4"/>
          <circle cx="112" cy="70" r="4"/>
          <circle cx="150" cy="52" r="4"/>
          <circle cx="196" cy="38" r="4"/>
          <circle cx="244" cy="30" r="4"/>
        </g>
      </svg>
    </div>

    <div class="author">David J. Cox</div>
    <div class="imprint">LeanPub &middot; 2026</div>
  </div>
</body>
</html>
